name: Verify and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: Europe/London

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify site (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-24.04
    # Official Playwright image: browsers and their system libraries are already
    # installed, so no per-run package or browser download. The tag must match the
    # @playwright/test version in package-lock.json (checked in the first step).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '>=22.18.0 <23'
          cache: npm
      - run: npm ci
      - name: Check the Playwright image matches the installed version
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "1.63.0" ]; then
            echo "@playwright/test is $installed but the container image is v1.63.0-noble. Update the image tag in .github/workflows/deploy.yml to match."
            exit 1
          fi
      - name: Verify generated site under the GitHub Pages project base path
        run: npm run build && npm run test:site
        env:
          SITE_URL: https://www.thefriendsofashley.org
          BASE_PATH: /foa-website/
      # Same steps as npm run verify, split so the browser suite can run as two shards.
      - name: Type checks, build and content tests
        run: npm run check && npm run build && npm run test:site
        env:
          SITE_URL: https://www.thefriendsofashley.org
          BASE_PATH: /
      - name: Browser tests (shard ${{ matrix.shard }} of 2)
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          SITE_URL: https://www.thefriendsofashley.org
          BASE_PATH: /
      - name: Retain browser diagnostics and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified site for deployment
        if: github.event_name != 'pull_request' && matrix.shard == 1
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
